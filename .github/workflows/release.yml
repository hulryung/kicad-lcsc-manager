name: Release Package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

# One release at a time: each run appends to the metadata on main.
concurrency:
  group: release-metadata
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check __version__
        run: |
          if ! grep -q "__version__ = \"${{ steps.version.outputs.version }}\"" plugins/lcsc_manager/__init__.py; then
            echo "::warning::The tagged commit's __version__ isn't ${{ steps.version.outputs.version }}; the packages get their own versions stamped in, but main's __init__.py is left as it is."
          fi

      - name: Bundle Python dependencies
        run: |
          chmod +x scripts/bundle-dependencies.sh
          ./scripts/bundle-dependencies.sh

      # Two zips per release, one version entry each (scripts/pcm_builds.py):
      # the SWIG build X.Y.Z for KiCad 9/10 and the IPC build (X+1).Y.Z for
      # KiCad 11. The script checks each zip (no bytecode, the right
      # metadata and version, plugin.json only in the IPC build) and fails
      # the run if one is wrong.
      - name: Build packages
        id: package
        run: |
          python3 scripts/build-packages.py "${{ steps.version.outputs.version }}" release
          for zip in release/*.zip; do
            echo "=== $zip (first 25 entries) ==="
            unzip -l "$zip" | sed -n '1,28p'    # not head: it would SIGPIPE unzip
          done
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json
          for build in json.load(open("release/builds.json")):
              print(f"{build['runtime']}_version={build['version']}")
              print(f"{build['runtime']}_zip={build['zip']}")
          EOF

      - name: Generate release notes
        id: release_notes
        run: |
          # Try to get commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            echo "## Changes since $PREV_TAG" > release_notes.md
            echo "" >> release_notes.md
            git log $PREV_TAG..HEAD --pretty=format:"- %s" >> release_notes.md
          else
            echo "## Release ${{ steps.version.outputs.tag }}" > release_notes.md
            echo "" >> release_notes.md
            echo "Initial release" >> release_notes.md
          fi

          cat >> release_notes.md <<'EOF'

          ## Installation

          Add this custom repository in KiCad's Plugin and Content Manager; it offers the right build for your KiCad:
          ```
          https://raw.githubusercontent.com/hulryung/kicad-lcsc-manager/main/repository.json
          ```

          Or download a package and use **Install from File…**:
          EOF
          echo "- KiCad 9 or 10: \`${{ steps.package.outputs.swig_zip }}\` (version ${{ steps.package.outputs.swig_version }})" >> release_notes.md
          echo "- KiCad 11, or its 10.99 nightlies: \`${{ steps.package.outputs.ipc_zip }}\` (version ${{ steps.package.outputs.ipc_version }}). It runs through KiCad's IPC API, so KiCad asks to turn the API server on when you install it." >> release_notes.md

          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.zip
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Updates metadata.json / packages.json / repository.json on the latest
      # main — not the tag's tree, which can lag behind it — and fails the run
      # if it can't. See scripts/publish-metadata.sh.
      - name: Publish metadata to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ./scripts/publish-metadata.sh "${{ steps.version.outputs.version }}" release/*.zip

      - name: Summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Release**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          python3 - >> $GITHUB_STEP_SUMMARY <<'EOF'
          import json
          for b in json.load(open("release/builds.json")):
              kicad = b["kicad_version"] + (f" to {b['kicad_version_max']}" if b.get("kicad_version_max") else "+")
              print(f"- **{b['runtime'].upper()} build {b['version']}** (KiCad {kicad}): `{b['zip']}`, "
                    f"{b['download_size']} bytes, SHA256 `{b['download_sha256']}`")
          EOF
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation URL" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "https://raw.githubusercontent.com/hulryung/kicad-lcsc-manager/main/repository.json" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
